name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build extension
        run: pnpm build

      - name: Install Chromium for e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (simulated ChatGPT pages, real extension)
        run: pnpm test:e2e

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
